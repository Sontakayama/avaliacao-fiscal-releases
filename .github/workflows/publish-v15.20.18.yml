name: Publish V15.20.18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v15.20.18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed bundle
        shell: powershell
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-64b0-820e-8541-56f88d02990e/raw?se=2026-10-05T18%3A27%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=3a9315a8-be1a-50c7-9c3b-3bba3e739388&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T17%3A14%3A50Z&ske=2026-10-06T17%3A14%3A50Z&sks=b&skv=2026-02-06&sig=tkfGlKt7/DJsJbEV1mN/74vgutXjvrK/7Fj4hTdhqKU%3D'
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile bundle.zip
          Expand-Archive bundle.zip -DestinationPath bundle -Force

      - name: Validate signed bundle
        shell: powershell
        run: |
          $pkg='bundle\AvaliacaoFiscal_Update_15.20.18.afupd'
          $shaFile='bundle\SHA256.txt'
          $latest='bundle\latest.json'
          $notes='bundle\RELEASE_NOTES.txt'
          foreach($f in @($pkg,$shaFile,$latest,$notes)){ if(-not(Test-Path $f)){ throw "Arquivo ausente: $f" } }
          $expected=((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){ throw 'SHA256 divergente.' }
          if($actual -ne 'a121711dbff44d5da711dd3f369fc0ff4dd52fad0f721bc58d4c6ba8fc133c91'){ throw 'Pacote diverge do artefato aprovado.' }
          $doc=Get-Content $latest -Raw -Encoding UTF8 | ConvertFrom-Json
          if($doc.version -ne '15.20.18'){ throw 'latest.json não é da V15.20.18.' }
          if($doc.minimum_version -ne '15.20.17'){ throw 'minimum_version divergente.' }

      - name: Publish stable V15.20.18
        shell: powershell
        run: |
          $dst='releases\15.20.18'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'bundle\AvaliacaoFiscal_Update_15.20.18.afupd' "$dst\AvaliacaoFiscal_Update_15.20.18.afupd" -Force
          Copy-Item 'bundle\RELEASE_NOTES.txt' "$dst\RELEASE_NOTES.txt" -Force
          Copy-Item 'bundle\SHA256.txt' "$dst\SHA256.txt" -Force
          Copy-Item 'bundle\latest.json' 'latest.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json releases/15.20.18
          git commit -m 'Publish signed Avaliacao Fiscal V15.20.18'
          git push origin HEAD:main