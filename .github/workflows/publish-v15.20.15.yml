name: Publish V15.20.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v15.20.15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed bundle
        shell: powershell
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4d24-820e-825a-615a9f4ab295/raw?se=2026-10-05T14%3A51%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=d1e467f6-0321-5288-8f19-bb1f13ea39ff&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T12%3A08%3A48Z&ske=2026-10-06T12%3A08%3A48Z&sks=b&skv=2026-02-06&sig=7iAQlqxBdD0V4taKRW2Qw/Zn/IRvNLTb9gq%2BL90b0xg%3D'
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile bundle.zip
          Expand-Archive bundle.zip -DestinationPath bundle -Force
          Get-ChildItem bundle -Recurse | Select-Object FullName,Length

      - name: Validate signed bundle metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pkg='bundle\AvaliacaoFiscal_Update_15.20.15.afupd'
          $shaFile='bundle\SHA256.txt'
          $latest='bundle\latest.json'
          $notes='bundle\RELEASE_NOTES.txt'
          foreach($f in @($pkg,$shaFile,$latest,$notes)){ if(-not(Test-Path $f)){ throw "Arquivo ausente: $f" } }
          $expected=((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){ throw "SHA256 divergente: esperado=$expected atual=$actual" }
          $doc=Get-Content $latest -Raw -Encoding UTF8 | ConvertFrom-Json
          if($doc.version -ne '15.20.15'){ throw 'latest.json não é da V15.20.15.' }
          if($doc.minimum_version -ne '15.20.14'){ throw 'minimum_version divergente.' }
          if($doc.sha256.ToLowerInvariant() -ne $actual){ throw 'latest.json contém SHA256 divergente.' }
          Write-Host "Pacote validado: $actual"

      - name: Publish stable V15.20.15
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst='releases\15.20.15'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'bundle\AvaliacaoFiscal_Update_15.20.15.afupd' "$dst\AvaliacaoFiscal_Update_15.20.15.afupd" -Force
          Copy-Item 'bundle\RELEASE_NOTES.txt' "$dst\RELEASE_NOTES.txt" -Force
          Copy-Item 'bundle\SHA256.txt' "$dst\SHA256.txt" -Force
          Copy-Item 'bundle\latest.json' 'latest.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json releases/15.20.15
          if(-not (git diff --cached --quiet)){
            git commit -m 'Publish signed Avaliacao Fiscal V15.20.15'
            git push origin HEAD:main
          } else {
            Write-Host 'Nenhuma alteração para publicar.'
          }