name: Publish Client V15.20.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-client-v15.20.17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download client bundle
        shell: powershell
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-d7a0-820e-81d3-da0381d7b595/raw?se=2026-10-05T17%3A32%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d7ee93fe-6e91-58e9-98b0-c9ae3ec99df1&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T13%3A31%3A35Z&ske=2026-10-06T13%3A31%3A35Z&sks=b&skv=2026-02-06&sig=hRtgeQKdMjYPuJmYBDjKg5kp1rzd66SC6QsLhZxv5bY%3D'
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile client.zip
          Expand-Archive client.zip -DestinationPath bundle -Force
          Get-ChildItem bundle | Select-Object Name,Length

      - name: Validate launcher bundle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content 'bundle\manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($manifest.version -ne '15.20.17'){ throw 'Manifesto do launcher pertence a outra versão.' }
          $text=''
          foreach($name in $manifest.chunks){
            $part=Join-Path 'bundle' ([string]$name)
            if(-not(Test-Path $part)){ throw "Chunk ausente: $name" }
            $text += [IO.File]::ReadAllText((Resolve-Path $part),[Text.Encoding]::ASCII)
          }
          $raw=[Convert]::FromBase64String($text)
          if($raw.Length -ne [int64]$manifest.size){ throw 'Tamanho reconstruído divergente.' }
          $tmp=Join-Path $env:RUNNER_TEMP 'AvaliacaoFiscal.exe'
          [IO.File]::WriteAllBytes($tmp,$raw)
          $hash=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne ([string]$manifest.sha256).ToLowerInvariant()){ throw 'SHA-256 reconstruído divergente.' }
          if($hash -ne '16925d51d4a4ca0266ba6451399503f38b1835c8e50c5019a4f40f5c2815d479'){ throw 'SHA-256 não corresponde ao launcher pinado.' }
          Write-Host "Launcher validado: $hash / $($raw.Length) bytes"

      - name: Publish client chunks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst='clients\15.20.17'
          if(Test-Path $dst){ Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'bundle\manifest.json' "$dst\manifest.json" -Force
          Get-ChildItem 'bundle' -Filter 'client.b64.part*' | ForEach-Object { Copy-Item $_.FullName (Join-Path $dst $_.Name) -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/15.20.17
          git commit -m 'Publish Edge App client V15.20.17'
          git push origin HEAD:main