name: Publish Client V15.20.18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-client-v15.20.18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download client bundle
        shell: powershell
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-eaa8-820e-ad04-375fd5e4e104/raw?se=2026-10-05T18%3A24%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=ed1275fc-b15a-596d-8961-1268ef36cdce&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T17%3A14%3A50Z&ske=2026-10-06T17%3A14%3A50Z&sks=b&skv=2026-02-06&sig=kMUMZgQI2vZz6t13jB7CF7okP7cThuT0lgayGQiy04w%3D'
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile client.zip
          Expand-Archive client.zip -DestinationPath bundle -Force

      - name: Validate launcher bundle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content 'bundle\manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($manifest.version -ne '15.20.18'){ throw 'Manifesto do launcher pertence a outra versão.' }
          $text=''
          foreach($name in $manifest.chunks){
            $part=Join-Path 'bundle' ([string]$name)
            if(-not(Test-Path $part)){ throw "Chunk ausente: $name" }
            $text += [IO.File]::ReadAllText((Resolve-Path $part),[Text.Encoding]::ASCII)
          }
          $raw=[Convert]::FromBase64String($text)
          $tmp=Join-Path $env:RUNNER_TEMP 'AvaliacaoFiscal.exe'
          [IO.File]::WriteAllBytes($tmp,$raw)
          $hash=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'a14a88019aef9e63c0437ae71e064d82ebe69daee4225137f53f06be5a4cb164'){ throw 'SHA-256 divergente.' }
          if($raw.Length -ne 8986394){ throw 'Tamanho divergente.' }

      - name: Publish client chunks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst='clients\15.20.18'
          if(Test-Path $dst){ Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'bundle\manifest.json' "$dst\manifest.json" -Force
          Get-ChildItem 'bundle' -Filter 'client.b64.part*' | ForEach-Object { Copy-Item $_.FullName (Join-Path $dst $_.Name) -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/15.20.18
          git commit -m 'Publish Edge App client V15.20.18'
          git push origin HEAD:main