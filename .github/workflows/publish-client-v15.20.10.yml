name: Publish Client V15.20.10

on:
  push:
    paths:
      - 'client-src/v15.20.10/**'
      - '.github/workflows/publish-client-v15.20.10.yml'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build launcher
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pywebview pillow
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar dependencias de build." }

          @'
          from PIL import Image, ImageDraw, ImageFont
          im=Image.new("RGBA",(256,256),(7,28,36,255))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((10,10,246,246),radius=48,fill=(9,78,90,255),outline=(38,219,207,255),width=8)
          try: f=ImageFont.truetype("arialbd.ttf",92)
          except: f=ImageFont.load_default()
          d.text((50,70),"AF",font=f,fill=(78,238,226,255))
          im.save("AF_CLIENT.ico",format="ICO",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 make_icon.py
          python make_icon.py

          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AvaliacaoFiscal --icon AF_CLIENT.ico --collect-all webview client-src/v15.20.10/client_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar AvaliacaoFiscal.exe." }
          if (-not (Test-Path "dist\AvaliacaoFiscal.exe")) { throw "EXE nao foi gerado." }

      - name: Encode and publish launcher
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path "dist\AvaliacaoFiscal.exe").Path
          $bytes=[IO.File]::ReadAllBytes($exe)
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $b64=[Convert]::ToBase64String($bytes)
          $out="clients/15.20.10"
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $chunkSize=786432
          $chunks=@()
          $i=0
          for($pos=0;$pos -lt $b64.Length;$pos+=$chunkSize){
            $len=[Math]::Min($chunkSize,$b64.Length-$pos)
            $name=("client.b64.part{0:D3}" -f $i)
            [IO.File]::WriteAllText((Join-Path $out $name),$b64.Substring($pos,$len),[Text.Encoding]::ASCII)
            $chunks += $name
            $i++
          }

          $manifest=[ordered]@{
            product="AVALIACAO_FISCAL_CLIENT"
            version="15.20.10"
            file="AvaliacaoFiscal.exe"
            sha256=$hash
            size=$bytes.Length
            encoding="base64"
            chunks=$chunks
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $out "manifest.json")

          Write-Host "CLIENT_SHA256=$hash"
          Write-Host "CLIENT_SIZE=$($bytes.Length)"
          Write-Host "CHUNKS=$($chunks.Count)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/15.20.10
          git commit -m "Publish AvaliacaoFiscal desktop client V15.20.10"
          git push origin HEAD:main
