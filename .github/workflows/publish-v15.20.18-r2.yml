name: Publish V15.20.18 R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v15.20.18-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed bundle
        shell: powershell
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b3c0-820e-90ae-d68aef18abbb/raw?se=2026-10-05T19%3A08%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=1ed91dfa-7147-5af0-8180-321db32b6cb3&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T11%3A21%3A35Z&ske=2026-10-06T11%3A21%3A35Z&sks=b&skv=2026-02-06&sig=ND3gWlzufyS139NlEPvazj%2B1zUfGcQ8Pp0uIVjD1eRw%3D'
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile bundle.zip
          Expand-Archive bundle.zip -DestinationPath bundle -Force

      - name: Validate signed bundle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pkg='bundle\AvaliacaoFiscal_Update_15.20.18.afupd'
          $shaFile='bundle\SHA256.txt'
          $latest='bundle\latest.json'
          $notes='bundle\RELEASE_NOTES.txt'
          foreach($f in @($pkg,$shaFile,$latest,$notes)){ if(-not(Test-Path $f)){ throw "Arquivo ausente: $f" } }
          $expected=((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){ throw 'SHA256 do bundle divergente.' }
          if($actual -ne 'd565f945176755c7835f5c8d8c7e3db3ee31c74dd0e70992cb7bf705f595b00c'){ throw 'Pacote diverge do artefato R2 aprovado.' }
          $doc=Get-Content $latest -Raw -Encoding UTF8 | ConvertFrom-Json
          if($doc.version -ne '15.20.18'){ throw 'latest.json não é da V15.20.18.' }
          if($doc.minimum_version -ne '15.20.17'){ throw 'minimum_version divergente.' }
          if(([string]$doc.sha256).ToLowerInvariant() -ne $actual){ throw 'latest.json aponta SHA divergente.' }

      - name: Publish stable V15.20.18 R2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst='releases\15.20.18'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'bundle\AvaliacaoFiscal_Update_15.20.18.afupd' "$dst\AvaliacaoFiscal_Update_15.20.18.afupd" -Force
          Copy-Item 'bundle\RELEASE_NOTES.txt' "$dst\RELEASE_NOTES.txt" -Force
          Copy-Item 'bundle\SHA256.txt' "$dst\SHA256.txt" -Force
          Copy-Item 'bundle\latest.json' 'latest.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json releases/15.20.18
          git commit -m 'Publish signed Avaliacao Fiscal V15.20.18 R2 hotfix'
          git push origin HEAD:main
