name: Publish V15.20.19 Stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v15.20.19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify signed package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='release-staging\v15.20.19'
          $manifest=Get-Content (Join-Path $src 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($manifest.version -ne '15.20.19'){ throw 'Manifesto temporário não é V15.20.19.' }
          if(([string]$manifest.sha256).ToLowerInvariant() -ne '9190e48764c017bd25295ea976120c59f810ba67ba581d1e84f8f2062d67756d'){ throw 'SHA esperado divergente.' }
          if([int64]$manifest.size -ne 2770680){ throw 'Tamanho esperado divergente.' }
          $builder=New-Object System.Text.StringBuilder
          foreach($name in $manifest.chunks){
            [void]$builder.Append([IO.File]::ReadAllText((Join-Path $src $name),[Text.Encoding]::ASCII))
          }
          $raw=[Convert]::FromBase64String($builder.ToString())
          $out=Join-Path $env:RUNNER_TEMP 'AvaliacaoFiscal_Update_15.20.19.afupd'
          [IO.File]::WriteAllBytes($out,$raw)
          $hash=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $out).Length
          if($hash -ne ([string]$manifest.sha256).ToLowerInvariant()){ throw 'SHA após reconstrução divergente.' }
          if($size -ne [int64]$manifest.size){ throw 'Tamanho após reconstrução divergente.' }
          "REBUILT_PACKAGE=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PACKAGE_SHA256=$hash"
          Write-Host "PACKAGE_SIZE=$size"

      - name: Validate stable metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='release-staging\v15.20.19'
          $latest=Get-Content (Join-Path $src 'latest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($latest.product -ne 'AVALIACAO_FISCAL'){ throw 'Produto inválido.' }
          if($latest.channel -ne 'stable'){ throw 'Canal inválido.' }
          if($latest.version -ne '15.20.19'){ throw 'Versão do latest inválida.' }
          if($latest.minimum_version -ne '15.20.18'){ throw 'minimum_version inválida.' }
          if(([string]$latest.sha256).ToLowerInvariant() -ne '9190e48764c017bd25295ea976120c59f810ba67ba581d1e84f8f2062d67756d'){ throw 'SHA do latest inválido.' }
          $current=Get-Content 'latest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($current.version -ne '15.20.18'){ throw "Canal stable esperado em 15.20.18, encontrado $($current.version)." }

      - name: Publish V15.20.19 stable
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='release-staging\v15.20.19'
          $dst='releases\15.20.19'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item $env:REBUILT_PACKAGE (Join-Path $dst 'AvaliacaoFiscal_Update_15.20.19.afupd') -Force
          Copy-Item (Join-Path $src 'SHA256.txt') (Join-Path $dst 'SHA256.txt') -Force
          Copy-Item (Join-Path $src 'RELEASE_NOTES.txt') (Join-Path $dst 'RELEASE_NOTES.txt') -Force
          Copy-Item (Join-Path $src 'latest.json') 'latest.json' -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json releases/15.20.19
          git commit -m "Publish Avaliacao Fiscal V15.20.19 stable"
          git push origin HEAD:main
