name: Publish V15.20.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v15.20.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed bundle
        shell: powershell
        env:
          BUNDLE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f3b0-820e-82b7-889b2906b036/raw?se=2026-10-05T14%3A24%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=4aecb5c3-1f1f-5289-9e7f-e26b4e06ee54&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T17%3A00%3A22Z&ske=2026-10-05T17%3A00%3A22Z&sks=b&skv=2026-02-06&sig=vxKPDJ8k3crPYqRS4KVkguxZyjY27NRSoELCA6nvWug%3D'
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile bundle.zip
          Expand-Archive bundle.zip -DestinationPath bundle -Force
          Get-ChildItem bundle -Recurse | Select-Object FullName,Length

      - name: Validate signed bundle metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pkg='bundle\AvaliacaoFiscal_Update_15.20.14.afupd'
          $shaFile='bundle\SHA256.txt'
          $latest='bundle\latest.json'
          $notes='bundle\RELEASE_NOTES.txt'
          foreach($f in @($pkg,$shaFile,$latest,$notes)){ if(-not(Test-Path $f)){ throw "Arquivo ausente: $f" } }
          $expected=((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){ throw "SHA256 divergente: esperado=$expected atual=$actual" }
          $doc=Get-Content $latest -Raw -Encoding UTF8 | ConvertFrom-Json
          if($doc.version -ne '15.20.14'){ throw 'latest.json não é da V15.20.14.' }
          if($doc.sha256.ToLowerInvariant() -ne $actual){ throw 'latest.json contém SHA256 divergente.' }
          Write-Host "Pacote validado: $actual"

      - name: Publish stable V15.20.14
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst='releases\15.20.14'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'bundle\AvaliacaoFiscal_Update_15.20.14.afupd' "$dst\AvaliacaoFiscal_Update_15.20.14.afupd" -Force
          Copy-Item 'bundle\RELEASE_NOTES.txt' "$dst\RELEASE_NOTES.txt" -Force
          Copy-Item 'bundle\SHA256.txt' "$dst\SHA256.txt" -Force
          Copy-Item 'bundle\latest.json' 'latest.json' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json releases/15.20.14
          if(-not (git diff --cached --quiet)){
            git commit -m 'Publish signed Avaliacao Fiscal V15.20.14'
            git push origin HEAD:main
          } else {
            Write-Host 'Nenhuma alteração para publicar.'
          }
